# No cambies config-version; efxBans lo usa para actualizar este archivo tras una actualización.
config-version: 1

# Todos los mensajes usan MiniMessage. Usa una lista o un bloque YAML | para varias líneas.
# Marcadores: {prefix} {player} {staff} {reason} {duration} {remaining} {id}
# {type} {created} {expires} {status} {closed_at} {closed_by} {close_reason}
# Los anuncios también tienen {change_reason}. La IP no aparece en ningún mensaje por defecto.
prefix: '<b><gradient:#FF5656:#FFB8B8>ᴇꜰxʙᴀɴꜱ</gradient></b> <gray>»'
# Patrón de Java DateTimeFormatter. La zona horaria se configura en config.yml.
date-format: 'dd/MM/yyyy HH:mm:ss'
permanent: Permanente
types:
  ban: Baneo
  ipban: Baneo de IP
  mute: Silencio
  kick: Expulsión
  warn: Advertencia
status:
  ACTIVE: Activo
  EXPIRED: Expirado
  REMOVED: Retirado
  REVOKED: Revocado
  EXECUTED: Aplicado

error: '{prefix} <#FF5656>{error}'
errors:
  player-offline: '{prefix} <#FF5656>{player} <#F2F4FF>no está conectado. <#009DFF>Las expulsiones <#F2F4FF>solo funcionan con jugadores conectados.'
  no-permission: '{prefix} <#F2F4FF>No tienes permiso para hacer esto: <#009DFF>{permission}'
  maximum-duration: '{prefix} <#F2F4FF>Tu duración máxima de sanción es <#009DFF>{maximum}'
  invalid-duration: '{prefix} <#FF5656>Duración no válida. <#F2F4FF>Ejemplos: <#009DFF>30m, 2h, 7d, 1d2h'
  invalid-reason: '{prefix} <#F2F4FF>El motivo debe tener <#009DFF>entre 1 y 1000 caracteres<#F2F4FF>.'
  reason-required: '{prefix} <#F2F4FF>Escribe un motivo después de la duración. <#009DFF>{usage}'
  account-required: '{prefix} <#F2F4FF>Escribe un <#009DFF>nombre de jugador <#F2F4FF>válido.'
  ambiguous-name: '{prefix} <#F2F4FF>Varias cuentas han usado este nombre; <#009DFF>usa el nombre actual <#F2F4FF>del jugador.'
  unknown-ip: '{prefix} <#F2F4FF>No hay ninguna IP registrada para este jugador. <#009DFF>Primero tiene que haber entrado al servidor.'
  duplicate-active: '{prefix} <#F2F4FF>Ya existe una <#009DFF>sanción activa <#F2F4FF>de este tipo; retírala o revócala primero.'
  preset-disabled: '{prefix} <#F2F4FF>Este preset se desactivó o se eliminó. <#009DFF>Reinicia el servidor <#F2F4FF>para actualizar el árbol de comandos.'
  exempt: '{prefix} <#FF5656>Este jugador está exento de esta sanción.'
  id-required: '{prefix} <#F2F4FF>Escribe un ID de sanción válido: <#009DFF>#123'
  import-unknown-source: '{prefix} <#F2F4FF>Origen desconocido. Usa <#009DFF>vanilla<#F2F4FF>, <#009DFF>litebans <#F2F4FF>o <#009DFF>advancedban<#F2F4FF>.'
  import-no-database: '{prefix} <#FF5656>La base de datos de efxBans no está disponible; no se puede importar nada.'
  import-busy: '{prefix} <#F2F4FF>Ya hay una importación en curso.'
  import-not-found: '{prefix} <#FF5656>No se encontró {file}<#F2F4FF>. ¿Está el plugin instalado en este servidor?'
  import-unsupported-storage: '{prefix} <#FF5656>{source} usa {storage}, <#F2F4FF>que efxBans no puede leer. Primero cambia {source} a MySQL o MariaDB.'
  import-plugin-required: '{prefix} <#F2F4FF>{plugin} guarda sus datos en un archivo local que solo se puede leer <#009DFF>mientras {plugin} está en marcha<#F2F4FF>. Mantenlo instalado hasta terminar la importación.'
database-error: '{prefix} <#F2F4FF>No se pudo confirmar el resultado. <#009DFF>Revisa el historial y la conexión a la base de datos <#F2F4FF>antes de volver a intentarlo; los registros existentes están a salvo.'
unavailable: '{prefix} <#F2F4FF>El sistema de sanciones no puede verificar nada en este momento. <#009DFF>Inténtalo de nuevo en un momento.'
unknown-player: '{prefix} <#FF5656>{player} <#F2F4FF>no se pudo verificar. Usa el nombre de un jugador conocido.'
usage: '{prefix} <#F2F4FF>Uso: <#009DFF>{usage}'
not-found: '{prefix} <#F2F4FF>No se encontraron <#009DFF>registros <#F2F4FF>que coincidan.'
# Las confirmaciones solo llegan al miembro del staff o a la consola que ejecutó el comando.
confirmation:
  ban: '{prefix} <#55FF55>{player} fue baneado.'
  ipban: '{prefix} <#55FF55>{player} fue baneado por IP.'
  mute: '{prefix} <#55FF55>{player} fue silenciado.'
  kick: '{prefix} <#55FF55>{player} fue expulsado.'
  warn: '{prefix} <#55FF55>{player} fue advertido.'
  silent: '{prefix} <#55FF55>{player}: {type} aplicado en silencio.'
  unban: '{prefix} <#55FF55>Se retiró el baneo de {player}.'
  unmute: '{prefix} <#55FF55>Se retiró el silencio de {player}.'
  undo: '{prefix} <#55FF55>Se revocó la sanción de {player}.'
muted: '{prefix} <#F2F4FF>Estás <#FF5656>silenciado. <#F2F4FF>Motivo: <#009DFF>{reason} <#F2F4FF>• Restante: <#009DFF>{remaining}'
muted-notice: '{prefix} <#009DFF>{staff} <#F2F4FF>te ha silenciado. Duración: <#009DFF>{duration} <#F2F4FF>• Motivo: <#009DFF>{reason}'
warned: '{prefix} <#009DFF>{staff} <#F2F4FF>te ha advertido. Motivo: <#009DFF>{reason}'
reload: '{prefix} <#F2F4FF>Se recargaron los mensajes, las notificaciones, los límites de permisos y los presets existentes<#009DFF>.'
reload-restart: '{prefix} <#F2F4FF>Se recargaron los ajustes seguros. <#009DFF>Reinicia el servidor por completo <#F2F4FF>para aplicar cambios de nombres de comandos, alias o base de datos.'
health: '{prefix} <#F2F4FF>Estado: <#009DFF>{health} <#F2F4FF>• efxBans {plugin} • Paper {version} • {database}'
help-header: '{prefix} <#F2F4FF>Gestión de sanciones <#009DFF>• efxBans'
help-entry: '<#009DFF>{usage}'
history-header: '{prefix} <#F2F4FF>Historial de sanciones de <#FF5656>{player} <#F2F4FF>• Página <#009DFF>{page}'
history-entry: '<#009DFF>#{id} <#F2F4FF>{type} • <#FF5656>{status} <#F2F4FF>• {created} • <#009DFF>{staff} <#F2F4FF>• {duration}<newline><#F2F4FF>  Motivo: <#009DFF>{reason}'
detail:
  - '{prefix} <#009DFF>#{id} <#F2F4FF>• {type} • <#FF5656>{status}'
  - '<#F2F4FF>Jugador: <#FF5656>{player} <#F2F4FF>• Staff: <#009DFF>{staff}'
  - '<#F2F4FF>Motivo: <#009DFF>{reason}'
  - '<#F2F4FF>Inicio: <#009DFF>{created} <#F2F4FF>• Fin: <#009DFF>{expires}'
  - '<#F2F4FF>Duración: <#009DFF>{duration} <#F2F4FF>• Restante: <#009DFF>{remaining}'
  - '<#F2F4FF>Retirada / revocada por: <#009DFF>{closed_by} <#F2F4FF>• {closed_at}'
audit-entry: '<gray>{created} <#009DFF>{action} <#F2F4FF>• {staff} • {reason}'
ip-detail: '{prefix} <#F2F4FF>Información privada de IP: <#009DFF>{ip}'
alts-header: '{prefix} <#F2F4FF>Cuentas que compartieron una IP con <#FF5656>{player} <#F2F4FF>en el pasado. <#009DFF>Esto no demuestra que sean la misma persona.'
alts-entry: '<#FF5656>{player}'

broadcast:
  unban: '{prefix} <#009DFF>{staff} <#F2F4FF>retiró el baneo de <#FF5656>{player}<#F2F4FF>.'
  unmute: '{prefix} <#009DFF>{staff} <#F2F4FF>retiró el silencio de <#FF5656>{player}<#F2F4FF>.'
  ban: '{prefix} <#009DFF>{staff} <#F2F4FF>baneó a <#FF5656>{player}<#F2F4FF>. Duración: <#009DFF>{duration} <#F2F4FF>• Motivo: <#009DFF>{reason}'
  ipban: '{prefix} <#009DFF>{staff} <#F2F4FF>baneó por IP a <#FF5656>{player}<#F2F4FF>. Duración: <#009DFF>{duration} <#F2F4FF>• Motivo: <#009DFF>{reason}'
  mute: '{prefix} <#009DFF>{staff} <#F2F4FF>silenció a <#FF5656>{player}<#F2F4FF>. Duración: <#009DFF>{duration} <#F2F4FF>• Motivo: <#009DFF>{reason}'
  kick: '{prefix} <#009DFF>{staff} <#F2F4FF>expulsó a <#FF5656>{player}<#F2F4FF>. Motivo: <#009DFF>{reason}'
  warn: '{prefix} <#009DFF>{staff} <#F2F4FF>advirtió a <#FF5656>{player}<#F2F4FF>. Motivo: <#009DFF>{reason}'
  remove: '{prefix} <#009DFF>{staff} <#F2F4FF>retiró la sanción de <#FF5656>{player}<#F2F4FF>.'
  undo: '{prefix} <#009DFF>{staff} <#F2F4FF>revocó la sanción de <#FF5656>{player}<#F2F4FF>.'

lists:
  banlist: '{prefix} <#F2F4FF>Baneos activos <#009DFF>• Total: {total} • Página {page}/{pages}'
  mutelist: '{prefix} <#F2F4FF>Silencios activos <#009DFF>• Total: {total} • Página {page}/{pages}'
  empty: '<#F2F4FF>No hay sanciones activas.'
  entry: '<#009DFF>#{id} <#FF5656>{player} <#F2F4FF>• {type} • <#009DFF>{remaining} <#F2F4FF>• {reason}'
  hover: '<#F2F4FF>Staff: <#009DFF>{staff}<newline><#F2F4FF>Inicio: <#009DFF>{created}<newline><#F2F4FF>Haz clic para ver los detalles.'
  previous: '<#009DFF>« Anterior  '
  next: '<#009DFF>  Siguiente »'
  page: '<#F2F4FF>[{page}/{pages}]'

screen:
  ban-issued:
    - '{prefix}'
    - '<#FF5656>Has sido baneado de este servidor.'
    - '<#F2F4FF>Staff: <#009DFF>{staff}'
    - '<#F2F4FF>Motivo: <#009DFF>{reason}'
    - '<#F2F4FF>Duración: <#009DFF>{duration}'
  ipban-issued:
    - '{prefix}'
    - '<#FF5656>Tu cuenta o tu conexión ha sido baneada.'
    - '<#F2F4FF>Staff: <#009DFF>{staff}'
    - '<#F2F4FF>Motivo: <#009DFF>{reason}'
    - '<#F2F4FF>Duración: <#009DFF>{duration}'
  ban:
    - '{prefix}'
    - '<#FF5656>Estás baneado de este servidor.'
    - ''
    - '<#F2F4FF>Jugador: <#FF5656>{player}'
    - '<#F2F4FF>Staff: <#009DFF>{staff}'
    - '<#F2F4FF>Motivo: <#009DFF>{reason}'
    - '<#F2F4FF>Duración: <#009DFF>{duration}'
    - '<#F2F4FF>Restante: <#009DFF>{remaining}'
    - '<#F2F4FF>ID de sanción: <#009DFF>#{id}'
  ipban:
    - '{prefix}'
    - '<#FF5656>Tu cuenta o tu conexión está baneada.'
    - ''
    - '<#F2F4FF>Staff: <#009DFF>{staff}'
    - '<#F2F4FF>Motivo: <#009DFF>{reason}'
    - '<#F2F4FF>Duración: <#009DFF>{duration}'
    - '<#F2F4FF>Restante: <#009DFF>{remaining}'
    - '<#F2F4FF>ID de sanción: <#009DFF>#{id}'
  kick:
    - '{prefix}'
    - '<#FF5656>Has sido expulsado del servidor.'
    - '<#F2F4FF>Staff: <#009DFF>{staff}'
    - '<#F2F4FF>Motivo: <#009DFF>{reason}'

# Al hacer clic se abre la página de la versión en GitHub. Marcadores: {current} {latest}
update:
  available: '{prefix} <#F2F4FF>Hay una nueva versión de efxBans: <#009DFF>{latest} <#F2F4FF>(instalada: {current}). <#009DFF><u>Haz clic para descargarla</u>'

# Lo siguiente es texto plano; se inserta tal cual dentro de otros mensajes.
usages:
  ban: '/ban [-s] <jugador> [duración] <motivo>'
  ipban: '/ipban [-s] <jugador|IP> [duración] <motivo>'
  mute: '/mute [-s] <jugador> [duración] <motivo>'
  kick: '/kick [-s] <jugador> <motivo>'
  warn: '/warn <jugador> <motivo>'
  unban: '/unban <#ID|jugador|IP>'
  unmute: '/unmute <#ID|jugador>'
  undo: '/undo <#ID>'
  history: '/history <jugador> [página]'
  punishment: '/punishment <#ID>'
  lookup: '/lookup <jugador|IP|#ID> [página]'
  banlist: '/banlist [página]'
  mutelist: '/mutelist [página]'
  alts: '/alts <jugador>'
  reload: '/efxbans reload'
  import: '/efxbans import <vanilla|litebans|advancedban> [confirm]'
  preset: '/{command} <jugador>'
texts:
  ip-target: Objetivo IP
  no-reason: Sin motivo
  target-required: 'Se necesita un jugador, una IP o un #ID.'
  invalid-operation: Operación no válida
  health-ready: Listo
  health-unavailable: Base de datos inaccesible
# Forma singular y plural de cada unidad.
time-units:
  week: semana
  weeks: semanas
  day: día
  days: días
  hour: hora
  hours: horas
  minute: minuto
  minutes: minutos
  second: segundo
  seconds: segundos
hidden: Oculto
none: '—'
# Títulos de los campos del embed de Discord
webhook:
  player: Jugador
  staff: Staff
  type: Sanción
  duration: Duración
  reason: Motivo
  ip: IP

inquiry:
  header: '{prefix} <#F2F4FF>Sanciones activas: <#FF5656>{target} <#009DFF>• Total: {total}'
  empty: '{prefix} <#F2F4FF>No hay sanciones activas para este objetivo.'
  entry:
    - '<dark_gray>────────────────────────────────'
    - '<#F2F4FF>Sanción: <#009DFF>#{id} • {type} <#F2F4FF>• <#FF5656>{status}'
    - '<#F2F4FF>Jugador: <#FF5656>{player}'
    - '<#F2F4FF>Staff: <#009DFF>{staff}'
    - '<#F2F4FF>Motivo: <#009DFF>{reason}'
    - '<#F2F4FF>Aplicada: <#009DFF>{created}'
    - '<#F2F4FF>Duración: <#009DFF>{duration} <#F2F4FF>• Restante: <#009DFF>{remaining}'
    - '<#F2F4FF>Fin: <#009DFF>{expires}'

# Importación desde otro plugin de sanciones. {source}: vanilla, litebans o advancedban
import:
  reading: '{prefix} <#F2F4FF>Leyendo <#009DFF>{source}<#F2F4FF>...'
  preview: '{prefix} <#F2F4FF>{source}: <#009DFF>{total} <#F2F4FF>encontrados • baneos: {bans} • silencios: {mutes} • advertencias: {warnings} • expulsiones: {kicks} • activos ahora: <#009DFF>{active} <#F2F4FF>• ya importados: {already}'
  confirm-hint: '{prefix} <#F2F4FF>Todavía no se ha cambiado nada. Usa <#009DFF>/efxbans import {source} confirm <#F2F4FF>para importar.'
  done: '{prefix} <#55FF55>Importación desde {source} terminada. Importados: {imported} • ya importados: {already} • omitidos por tener ya una sanción activa de ese tipo: {conflicts}'
  failed: '{prefix} <#FF5656>La importación desde {source} falló: <#F2F4FF>{error}'
