  kick: '{prefix} <#55FF55>{player} wurde gekickt.'
  warn: '{prefix} <#55FF55>{player} wurde verwarnt.'
  silent: '{prefix} <#55FF55>{player}: {type} still angewendet.'
  unban: '{prefix} <#55FF55>Der Bann von {player} wurde aufgehoben.'
