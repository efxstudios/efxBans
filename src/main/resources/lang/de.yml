config-version: 3
prefix: '<b><gradient:#FF5656:#FFB8B8>ᴇꜰxʙᴀɴꜱ</gradient></b> <gray>»'
date-format: 'dd.MM.yyyy HH:mm:ss'
permanent: Dauerhaft
types:
  ban: Bann
  ipban: IP-Bann
  mute: Stummschaltung
  kick: Kick
  warn: Verwarnung
status:
  ACTIVE: Aktiv
  EXPIRED: Abgelaufen
  REMOVED: Aufgehoben
  REVOKED: Widerrufen
  EXECUTED: Ausgeführt

error: '{prefix} <#FF5656>{error}'
errors:
