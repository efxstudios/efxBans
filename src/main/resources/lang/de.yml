  import-busy: '{prefix} <#F2F4FF>Es läuft bereits ein Import.'
  import-not-found: '{prefix} <#FF5656>{file} <#F2F4FF>wurde nicht gefunden. Ist das Plugin auf diesem Server installiert?'
  import-unsupported-storage: '{prefix} <#FF5656>{source} verwendet {storage}, <#F2F4FF>was efxBans nicht lesen kann. Stelle {source} zuerst auf MySQL oder MariaDB um.'
  import-plugin-required: '{prefix} <#F2F4FF>{plugin} speichert seine Daten in einer lokalen Datei, die nur gelesen werden kann, <#009DFF>während {plugin} läuft<#F2F4FF>. Lass es bis zum Ende des Imports installiert.'
database-error: '{prefix} <#F2F4FF>Das Ergebnis konnte nicht bestätigt werden. <#009DFF>Prüfe den Verlauf und die Datenbankverbindung, <#F2F4FF>bevor du es erneut versuchst; vorhandene Einträge bleiben erhalten.'
