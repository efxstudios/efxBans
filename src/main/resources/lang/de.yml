unknown-player: '{prefix} <#FF5656>{player} <#F2F4FF>konnte nicht überprüft werden. Verwende den Namen eines bekannten Spielers.'
usage: '{prefix} <#F2F4FF>Verwendung: <#009DFF>{usage}'
