  no-permission: '{prefix} <#F2F4FF>Dafür fehlt dir die Berechtigung: <#009DFF>{permission}'
  maximum-duration: '{prefix} <#F2F4FF>Deine maximale Strafdauer: <#009DFF>{maximum}'
  invalid-duration: '{prefix} <#FF5656>Ungültige Dauer. <#F2F4FF>Beispiele: <#009DFF>30m, 2h, 7d, 1d2h'
  invalid-reason: '{prefix} <#F2F4FF>Der Grund muss <#009DFF>1–1000 Zeichen <#F2F4FF>lang sein.'
  reason-required: '{prefix} <#F2F4FF>Gib nach der Dauer einen Grund an. <#009DFF>{usage}'
  account-required: '{prefix} <#F2F4FF>Gib einen gültigen <#009DFF>Spielernamen <#F2F4FF>ein.'
  ambiguous-name: '{prefix} <#F2F4FF>Mehrere Accounts haben diesen Namen benutzt; <#009DFF>verwende den aktuellen Namen <#F2F4FF>des Spielers.'
  unknown-ip: '{prefix} <#F2F4FF>Für diesen Spieler ist keine IP-Adresse gespeichert. <#009DFF>Er muss den Server erst einmal betreten haben.'
  duplicate-active: '{prefix} <#F2F4FF>Es gibt bereits eine <#009DFF>aktive Strafe <#F2F4FF>dieser Art; hebe sie zuerst auf oder widerrufe sie.'
  preset-disabled: '{prefix} <#F2F4FF>Dieses Preset wurde deaktiviert oder entfernt. <#009DFF>Starte den Server neu, <#F2F4FF>um den Befehlsbaum zu aktualisieren.'
  exempt: '{prefix} <#FF5656>Dieser Spieler ist von dieser Strafe ausgenommen.'
  id-required: '{prefix} <#F2F4FF>Gib eine gültige Straf-ID ein: <#009DFF>#123'
