name: efxBans
version: '${project.version}'
main: com.efxstudios.bans.paper.BansPlugin
api-version: '1.20.6'
folia-supported: true
authors: [efx1st]
description: Punishment management for Paper and Folia servers
website: https://efxstudios.com
dependencies:
  server:
    Essentials:
      load: BEFORE
      required: false
      join-classpath: false
permissions:
  efxbans.lookup: {default: op}
  # Old name of efxbans.lookup; still grants it so existing permission setups keep working.
  efxbans.sorgu:
    default: op
    children:
      efxbans.lookup: true
  efxbans.banlist: {default: op}
  efxbans.mutelist: {default: op}
  efxbans.ban: {default: op}
  efxbans.ban.silent: {default: op}
  efxbans.ban.temporary: {default: op}
  efxbans.ban.permanent: {default: op}
  efxbans.ipban: {default: op}
  efxbans.ipban.silent: {default: op}
  efxbans.ipban.temporary: {default: op}
  efxbans.ipban.permanent: {default: op}
  efxbans.ipban.address: {default: op}
  efxbans.mute: {default: op}
  efxbans.mute.silent: {default: op}
  efxbans.mute.temporary: {default: op}
  efxbans.mute.permanent: {default: op}
  efxbans.kick: {default: op}
  efxbans.kick.silent: {default: op}
  efxbans.warn: {default: op}
  efxbans.unban: {default: op}
  efxbans.unban.address: {default: op}
  efxbans.unmute: {default: op}
  efxbans.undo: {default: op}
  efxbans.history: {default: op}
  efxbans.alts: {default: op}
  efxbans.ip.view: {default: op}
  efxbans.notify: {default: op}
  efxbans.reload: {default: op}
  efxbans.admin: {default: op}
  efxbans.import: {default: op}
  efxbans.update.notify: {default: op}
  efxbans.duration.unlimited: {default: false}
  efxbans.bypass.exempt: {default: false}
  efxbans.exempt.all: {default: false}
  efxbans.exempt.ban: {default: false}
  efxbans.exempt.ipban: {default: false}
  efxbans.exempt.mute: {default: false}
  efxbans.exempt.kick: {default: false}
  efxbans.exempt.warn: {default: false}
