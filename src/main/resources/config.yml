# Do not edit config-version. efxBans uses it to upgrade this file after an update;
# a backup of the old file is written to backups/ first.
config-version: 3

# Message file to use: lang/<language>.yml. Bundled: en, tr, de, es, fr.
# Copy one of them (for example to lang/pt_br.yml) to add your own translation;
# keys you leave out fall back to English.
language: en

# Timezone for dates in messages, e.g. Europe/Istanbul, Europe/Berlin, America/New_York.
timezone: UTC

# Changing the database or the poll interval needs a full restart.
database:
  type: sqlite # sqlite | mysql. SQLite file: plugins/efxBans/punishments.db
  mysql:
    host: localhost
    port: 3306
    database: efxbans
    username: efxbans
    password: ''
    tls: true # Verifies the MySQL server certificate and host name.
    pool-size: 4

# Paper servers sharing one MySQL database read each other's changes from the change log.
# There is no proxy component; install efxBans on every Paper server.
network:
  poll-millis: 500
  fail-closed-after-millis: 15000

permissions:
  default-maximum: 30d
  # The highest matching limit applies. A limit below default-maximum does not lower it.
  # efxbans.duration.unlimited only removes the limit; it grants no punishment permission.
  duration-limits:
    - permission: efxbans.limit.senior
      maximum: 90d
    - permission: efxbans.limit.admin
      maximum: 365d
  # Console and RCON also need the punishment permissions, and must match this list.
  console-allowed: ['*']

notifications:
  public: false # false: only players with efxbans.notify and the console see announcements

mute:
  # Namespaced forms are caught too, e.g. /minecraft:msg.
  # Add the aliases of your private message plugin here.
  blocked-commands: [msg, tell, w, whisper, m, message, r, reply, me, say, emote, teammsg, tm]

discord:
  enabled: false
  url: ''
  include-ip: false
  actions: [ban, ipban, mute, kick, warn, remove, undo]
  title: efxBans
  footer: 'efxBans • Punishment log'

# Checks Modrinth for a newer stable release compatible with this Minecraft version and server.
# Download page: https://modrinth.com/project/efxbans/
# No server or player data is sent. Set enabled: false to turn it off completely.
update-checker:
  enabled: true
  notify-staff: true # Tells players with efxbans.update.notify when they join
  interval-hours: 12 # 1–168

# Each preset needs: its preset permission + the punishment permission + temporary/permanent + the duration limit.
presets:
  cheating:
    enabled: true
    command: cheating
    aliases: [hacks]
    type: IPBAN
    duration: 30d
    reason: Cheating
    permission: efxbans.preset.cheating
  advertising:
    enabled: true
    command: advertising
    aliases: []
    type: MUTE
    duration: 7d
    reason: Advertising
    permission: efxbans.preset.advertising
  swearing:
    enabled: true
    command: swearing
    aliases: []
    type: MUTE
    duration: 2h
    reason: Swearing
    permission: efxbans.preset.swearing
  spam:
    enabled: true
    command: spam
    aliases: []
    type: WARN
    duration: permanent
    reason: Spamming the chat
    permission: efxbans.preset.spam
