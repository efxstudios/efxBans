name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Don't use this form for security issues; see [SECURITY.md](../blob/main/SECURITY.md) for private reporting.
        Remove the database password, webhook URL and IP addresses before sharing logs or config.
  - type: input
    id: version
    attributes:
      label: efxBans version
      description: "The version shown by `/efxbans status`"
      placeholder: 1.1.0
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Paper and Java version
      placeholder: Paper 1.21.11 build 120, Java 21
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      options: [SQLite, MySQL]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. /ban Player 1d test
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output
      description: The relevant error lines, with passwords and URLs removed
      render: text
