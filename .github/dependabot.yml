version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Compiled against what the oldest supported Paper release ships (see pom.xml); newer versions
      # would let code use APIs that 1.20.6 servers do not have.
      - dependency-name: "net.kyori:*"
      - dependency-name: "io.papermc.paper:paper-api"
    groups:
      test-libraries:
        patterns: ['org.junit*', 'org.mockito*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
